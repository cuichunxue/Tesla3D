<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Tesla Particle Viewer (Logo + Silhouette) - Three.js</title>
  <style>
    :root{
      --bg0:#05060a;
      --bg1:#0b1030;
      --fg:#e8ecff;
      --muted:#aab3ff;
      --panel: rgba(10, 12, 24, .62);
      --border: rgba(255,255,255,.10);
      --danger: #ff5370;
      --ok: #2ce2a2;
    }
    html,body{height:100%;margin:0;background:radial-gradient(1200px 900px at 20% 10%, var(--bg1), var(--bg0)); color:var(--fg); overflow:hidden;}
    canvas{display:block;}
    #hud{
      position:fixed; inset:18px 18px auto 18px;
      display:flex; gap:12px; align-items:stretch; pointer-events:none;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
      letter-spacing:.2px;
    }
    .card{
      pointer-events:auto;
      min-width: 300px;
      padding:14px 14px 12px 14px;
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border:1px solid var(--border);
      border-radius:14px;
      box-shadow: 0 18px 60px rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
    }
    .title{
      font-weight:800; font-size:14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    }
    .badge{
      font-size:11px; padding:3px 8px; border-radius:999px;
      border:1px solid rgba(255,255,255,.16);
      background: rgba(120,140,255,.10);
      color: var(--muted);
    }
    .row{display:flex; gap:10px; margin-top:10px; flex-wrap:wrap;}
    button{
      appearance:none; border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color:var(--fg);
      padding:8px 10px; border-radius:12px;
      font-weight:700; font-size:12px;
      cursor:pointer;
      transition: transform .06s ease, background .2s ease, border-color .2s ease;
    }
    button:hover{ background: rgba(255,255,255,.10); border-color: rgba(255,255,255,.20); }
    button:active{ transform: translateY(1px) scale(.99); }
    button.primary{
      border-color: rgba(120,140,255,.45);
      background: rgba(120,140,255,.14);
      box-shadow: 0 0 0 1px rgba(120,140,255,.12), 0 16px 40px rgba(50,70,255,.10);
    }
    .hint{
      margin-top:10px; font-size:12px; line-height:1.45;
      color: rgba(232,236,255,.78);
    }
    .hint b{ color: rgba(232,236,255,.95); }
    #drop{
      position:fixed; inset:auto 18px 18px 18px;
      display:flex; justify-content:space-between; gap:12px; align-items:center;
      pointer-events:none;
    }
    .dropzone{
      pointer-events:auto;
      flex:1;
      padding:12px 14px;
      background: var(--panel);
      border:1px dashed rgba(120,140,255,.35);
      border-radius:14px;
      color: rgba(232,236,255,.85);
      box-shadow: 0 18px 60px rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
      display:flex; gap:10px; align-items:center; justify-content:space-between;
    }
    .dropzone small{ color: rgba(232,236,255,.60); }
    .kbd{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; padding:2px 6px; border-radius:8px; border:1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.05); }
    #toast{
      position:fixed; right:18px; top:18px;
      max-width:min(420px, calc(100vw - 36px));
      padding:10px 12px;
      border-radius:14px;
      background: rgba(10, 12, 24, .72);
      border:1px solid rgba(255,255,255,.12);
      box-shadow: 0 18px 60px rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
      font-size:12px;
      opacity:0; transform: translateY(-6px);
      transition: opacity .2s ease, transform .2s ease;
      pointer-events:none;
    }
    #toast.show{opacity:1; transform: translateY(0);}
    #toast .ok{ color: var(--ok); font-weight:800;}
    #toast .bad{ color: var(--danger); font-weight:800;}
  </style>
</head>
<body>
  <div id="hud">
    <div class="card">
      <div class="title">
        Tesla Particle Viewer
        <span class="badge">Silhouette Boost</span>
        <span class="badge">Tesla Logo Attractor</span>
        <span class="badge">Orbit / Zoom / Pan</span>
      </div>

      <div class="row">
        <button id="btnExplode" class="primary">収束 ⇄ 拡散</button>
        <button id="btnAuto" class="primary">自動回転</button>
        <button id="btnReset">リセット</button>
        <button id="btnShot">スクショ</button>
      </div>

      <div class="hint">
        <b>操作:</b> ドラッグ=回転 / ホイール=ズーム / 右ドラッグ=パン<br/>
        <b>DnD:</b> <span class="kbd">.glb</span> / <span class="kbd">.gltf</span> をドロップ → 形状を粒子化 + 輪郭強調<br/>
        <b>キー:</b> <span class="kbd">G</span>=GUI表示切替 / <span class="kbd">H</span>=HUD切替
      </div>
    </div>
  </div>

  <div id="drop">
    <div class="dropzone" id="dropzone">
      <div>
        <div style="font-weight:800;">モデルをここにドロップ（GLB/GLTF）</div>
        <small>未指定なら内蔵の“Teslaっぽい”車体形状で表示（輪郭強調はモデル時に最適）</small>
      </div>
      <div style="display:flex; gap:10px; align-items:center;">
        <span class="kbd">G</span><span style="opacity:.75;">GUI</span>
        <span class="kbd">H</span><span style="opacity:.75;">HUD</span>
      </div>
    </div>
  </div>

  <div id="toast"></div>

<script type="module">
  import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
  import { OrbitControls } from "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js";
  import { EffectComposer } from "https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js";
  import { RenderPass } from "https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/RenderPass.js";
  import { UnrealBloomPass } from "https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/UnrealBloomPass.js";
  import { AfterimagePass } from "https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/AfterimagePass.js";
  import { OutputPass } from "https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/OutputPass.js";
  import { GLTFLoader } from "https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";
  import { GUI } from "https://unpkg.com/three@0.160.0/examples/jsm/libs/lil-gui.module.min.js";

  // --------------------------
  // HUD toast
  // --------------------------
  const toastEl = document.getElementById("toast");
  function toast(msg, ok=true){
    toastEl.innerHTML = `<span class="${ok?'ok':'bad'}">${ok?'OK':'ERR'}</span> ${msg}`;
    toastEl.classList.add("show");
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(()=>toastEl.classList.remove("show"), 2400);
  }

  // --------------------------
  // Scene / Renderer
  // --------------------------
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x060814, 0.045);

  const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.01, 500);
  camera.position.set(0, 1.2, 5.2);

  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false, preserveDrawingBuffer:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  document.body.appendChild(renderer.domElement);

  // Controls
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.minDistance = 1.2;
  controls.maxDistance = 30;
  controls.target.set(0, 0.8, 0);

  // Lights
  const key = new THREE.DirectionalLight(0xb9c6ff, 0.55);
  key.position.set(4, 6, 2);
  scene.add(key);
  scene.add(new THREE.AmbientLight(0x8aa0ff, 0.14));

  // Ground plane (depth cue)
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(80, 80),
    new THREE.MeshStandardMaterial({
      color: 0x070913,
      roughness: 0.95,
      metalness: 0.05
    })
  );
  ground.rotation.x = -Math.PI/2;
  ground.position.y = 0;
  scene.add(ground);

  // --------------------------
  // Postprocessing
  // --------------------------
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.9, 0.35, 0.2);
  composer.addPass(bloom);
  const afterimage = new AfterimagePass(0.88);
  composer.addPass(afterimage);
  composer.addPass(new OutputPass());

  // --------------------------
  // Core containers
  // --------------------------
  const root = new THREE.Group();
  scene.add(root);

  // particle buffers
  let points = null;
  let basePositions = null;    // Float32Array
  let targetPositions = null;  // Float32Array
  let scatterPositions = null; // Float32Array
  let velocities = null;       // Float32Array

  // silhouette + logo
  let normals = null;          // Float32Array | null
  let aW = null;               // Float32Array silhouette weight per particle
  let logoTargets = null;      // Float32Array
  let logoCount = 0;

  // --------------------------
  // Params
  // --------------------------
  const params = {
    // particle look
    count: 120000,
    size: 0.012,
    opacity: 1.0,
    colorA: "#b8c5ff",
    colorB: "#ffffff",
    colorMix: 0.45,

    // motion
    explode: 0.0,
    explodeRadius: 2.6,
    spring: 0.08,
    damping: 0.84,
    noise: 0.18,
    flow: 0.8,
    edgePull: 0.14,      // silhouette particles push outward a bit (tight silhouette)

    // auto rotate
    autoRotate: false,
    autoRotateSpeed: 0.25,

    // Tesla logo attractor
    logo: 0.65,          // 0..1 (default ON)
    logoSize: 0.60,
    logoLift: 1.18,
    logoX: -0.75,        // forward on hood (tune per model)
    logoZ: 0.00,

    // FX
    bloomStrength: 0.9,
    bloomRadius: 0.35,
    bloomThreshold: 0.2,
    trail: 0.88,
    exposure: 1.05,

    // UI
    showHUD: true,
  };

  // --------------------------
  // Particle material (silhouette-aware)
  // --------------------------
  const particleMat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    uniforms: {
      uSize: { value: params.size * 1000 },
      uOpacity: { value: params.opacity },
      uColorA: { value: new THREE.Color(params.colorA) },
      uColorB: { value: new THREE.Color(params.colorB) },
      uColorMix: { value: params.colorMix },
      uTime: { value: 0 },
    },
    vertexShader: `
      uniform float uSize;
      uniform float uTime;
      attribute float aW;
      varying float vW;
      varying float vDepth;

      void main(){
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vDepth = clamp((-mv.z - 1.0) / 14.0, 0.0, 1.0);
        vW = aW;

        float size = uSize / max(1.0, -mv.z);
        size *= mix(1.0, 2.0, vW);

        gl_PointSize = size;
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: `
      uniform float uOpacity;
      uniform vec3 uColorA;
      uniform vec3 uColorB;
      uniform float uColorMix;
      varying float vDepth;
      varying float vW;

      void main(){
        vec2 uv = gl_PointCoord - vec2(0.5);
        float d = length(uv);
        float alpha = smoothstep(0.5, 0.0, d);
        alpha = pow(alpha, 1.35);

        vec3 col = mix(uColorA, uColorB, mix(uColorMix, 1.0, vDepth));
        col *= mix(1.0, 1.7, vW);
        alpha *= mix(1.0, 1.3, vW);

        gl_FragColor = vec4(col, alpha * uOpacity);
      }
    `
  });

  function disposePoints(){
    if(!points) return;
    points.geometry.dispose();
    points.material.dispose();
    root.remove(points);
    points = null;
    basePositions = targetPositions = scatterPositions = velocities = null;
    normals = null;
    aW = null;
    logoTargets = null;
    logoCount = 0;
  }

  // --------------------------
  // Helpers
  // --------------------------
  const rand = (a,b)=> a + Math.random()*(b-a);

  function smoothstep01(x){
    x = THREE.MathUtils.clamp(x,0,1);
    return x*x*(3-2*x);
  }

  function centerAndScalePositions(arr, targetRadius=1.0){
    let minX=Infinity,minY=Infinity,minZ=Infinity;
    let maxX=-Infinity,maxY=-Infinity,maxZ=-Infinity;
    for(let i=0;i<arr.length;i+=3){
      const x=arr[i], y=arr[i+1], z=arr[i+2];
      minX=Math.min(minX,x); minY=Math.min(minY,y); minZ=Math.min(minZ,z);
      maxX=Math.max(maxX,x); maxY=Math.max(maxY,y); maxZ=Math.max(maxZ,z);
    }
    const cx=(minX+maxX)/2, cy=(minY+maxY)/2, cz=(minZ+maxZ)/2;
    let maxR=0;
    for(let i=0;i<arr.length;i+=3){
      const x=arr[i]-cx, y=arr[i+1]-cy, z=arr[i+2]-cz;
      maxR = Math.max(maxR, Math.sqrt(x*x+y*y+z*z));
    }
    const s = (maxR>0) ? (targetRadius/maxR) : 1;
    for(let i=0;i<arr.length;i+=3){
      arr[i]   = (arr[i]-cx)*s;
      arr[i+1] = (arr[i+1]-cy)*s + 0.9;
      arr[i+2] = (arr[i+2]-cz)*s;
    }
  }

  function makeScatterFromBase(baseArr){
    const out = new Float32Array(baseArr.length);
    for(let i=0;i<baseArr.length;i+=3){
      const x=baseArr[i], y=baseArr[i+1], z=baseArr[i+2];
      const r = params.explodeRadius * (0.55 + Math.random()*0.65);
      const th = Math.random()*Math.PI*2;
      const ph = Math.acos(THREE.MathUtils.clamp(1 - 2*Math.random(), -1, 1));
      const sx = r*Math.sin(ph)*Math.cos(th);
      const sy = r*Math.cos(ph);
      const sz = r*Math.sin(ph)*Math.sin(th);
      out[i]   = x + sx;
      out[i+1] = y + sy;
      out[i+2] = z + sz;
    }
    return out;
  }

  // --------------------------
  // Tesla logo points from SVG-like ShapePath (clean, stable "T")
  // --------------------------
  function buildTeslaLogoPointsSVG(N){
    const path = new THREE.ShapePath();
    // stylized but "Tesla T"-like, smooth and symmetric
    path.moveTo( 0.00,  1.00);
    path.bezierCurveTo( 0.35,  1.00,  0.55,  0.85,  0.55,  0.65);
    path.bezierCurveTo( 0.55,  0.45,  0.25,  0.35,  0.10,  0.30);
    path.lineTo( 0.02, -1.00);
    path.lineTo(-0.02, -1.00);
    path.lineTo(-0.10,  0.30);
    path.bezierCurveTo(-0.25,  0.35, -0.55,  0.45, -0.55,  0.65);
    path.bezierCurveTo(-0.55,  0.85, -0.35,  1.00,  0.00,  1.00);

    const shapes = path.toShapes(true);
    const pts = [];

    shapes.forEach(s=>{
      const p = s.getSpacedPoints(Math.max(400, Math.floor(N / shapes.length)));
      p.forEach(v=>pts.push(v.x, 0, v.y)); // XZ plane (Y=0)
    });

    const out = new Float32Array(N*3);
    const m = pts.length/3;
    for(let i=0;i<N;i++){
      const j = (i % m) * 3;
      out[i*3+0] = pts[j+0];
      out[i*3+1] = pts[j+1];
      out[i*3+2] = pts[j+2];
    }
    return out;
  }

  // --------------------------
  // Procedural Tesla-like point cloud (fallback)
  // --------------------------
  function buildProceduralTeslaPoints(count){
    const keep = [];
    const capsuleField = (p, a, b, r) => {
      const pa = p.clone().sub(a);
      const ba = b.clone().sub(a);
      const h = THREE.MathUtils.clamp(pa.dot(ba)/ba.dot(ba), 0, 1);
      return pa.sub(ba.multiplyScalar(h)).length() - r;
    };

    const tmp = new THREE.Vector3();
    const p = new THREE.Vector3();

    const aBody = new THREE.Vector3(-1.7, 0.55, 0);
    const bBody = new THREE.Vector3( 1.7, 0.55, 0);
    const rBody = 0.62;

    const aCab  = new THREE.Vector3(-0.55, 1.05, 0);
    const bCab  = new THREE.Vector3( 0.95, 1.05, 0);
    const rCab  = 0.42;

    const wheelC = [
      new THREE.Vector3(-1.10, 0.35, 0.78),
      new THREE.Vector3( 1.05, 0.35, 0.78),
      new THREE.Vector3(-1.10, 0.35,-0.78),
      new THREE.Vector3( 1.05, 0.35,-0.78),
    ];

    let tries = 0;
    while(keep.length < count*3 && tries < count*18){
      tries++;
      p.set(rand(-2.1, 2.1), rand(0.05, 1.8), rand(-1.05, 1.05));
      const dBody = capsuleField(p, aBody, bBody, rBody);
      const dCab  = capsuleField(p, aCab,  bCab,  rCab);
      let d = Math.min(dBody, dCab);

      let arch = 0;
      for(const wc of wheelC){
        const dist = p.distanceTo(wc);
        arch += Math.exp(-dist*dist*6.0);
      }
      const density = THREE.MathUtils.clamp(1.0 - arch*0.55, 0.10, 1.0);

      if(d < 0 && Math.random() < density){
        tmp.copy(p);
        const t = THREE.MathUtils.clamp((tmp.x + 2.1)/4.2, 0, 1);
        tmp.z *= THREE.MathUtils.lerp(0.72, 1.0, smoothstep01(t));
        tmp.y += 0.06 * Math.sin((tmp.x+1.8)*1.1) * Math.exp(-tmp.z*tmp.z*1.8);

        keep.push(tmp.x, tmp.y, tmp.z);
      }
    }

    const arr = new Float32Array(keep);
    centerAndScalePositions(arr, 1.0);
    return arr;
  }

  // --------------------------
  // Create point cloud (+ normals optional) + logo targets
  // --------------------------
  function createPointCloudFromPositions(posArr, normalArr=null){
    disposePoints();

    basePositions = posArr;
    normals = normalArr;
    targetPositions = new Float32Array(posArr);
    scatterPositions = makeScatterFromBase(basePositions);
    velocities = new Float32Array(posArr.length);

    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(targetPositions, 3));

    aW = new Float32Array(posArr.length/3);
    geo.setAttribute("aW", new THREE.BufferAttribute(aW, 1));

    if(normals){
      geo.setAttribute("normal", new THREE.BufferAttribute(normals, 3));
    }

    points = new THREE.Points(geo, particleMat);
    root.add(points);

    // Tesla Logo: allocate subset for attractor
    logoCount = Math.min(6000, Math.floor((posArr.length/3) * 0.06));
    logoTargets = buildTeslaLogoPointsSVG(logoCount);

    controls.target.set(0, 0.9, 0);
    controls.update();

    toast(`パーティクル生成: ${(posArr.length/3).toLocaleString()}点 / ロゴ粒子: ${logoCount.toLocaleString()}点`, true);
  }

  // Default startup: procedural car (no normals)
  createPointCloudFromPositions(buildProceduralTeslaPoints(params.count), null);

  // --------------------------
  // Animation loop
  // --------------------------
  const clock = new THREE.Clock();
  const _viewDir = new THREE.Vector3();
  const _q = new THREE.Quaternion();
  const _n = new THREE.Vector3();

  function tick(){
    requestAnimationFrame(tick);
    const dt = Math.min(clock.getDelta(), 0.033);
    const t = clock.elapsedTime;

    if(params.autoRotate){
      root.rotation.y += dt * params.autoRotateSpeed;
    }
    controls.update();

    particleMat.uniforms.uTime.value = t;

    // silhouette weight update (only if normals exist)
    if(points && normals && aW){
      camera.getWorldDirection(_viewDir);
      root.getWorldQuaternion(_q);

      for(let i=0;i<aW.length;i++){
        _n.set(normals[i*3], normals[i*3+1], normals[i*3+2]).applyQuaternion(_q).normalize();
        aW[i] = Math.pow(1.0 - Math.abs(_n.dot(_viewDir)), 2.0);
      }
      points.geometry.attributes.aW.needsUpdate = true;
    } else if(aW) {
      // no normals: keep weights near 0 (stable)
      // (do nothing to save time)
    }

    // particle dynamics
    if(points){
      const pos = points.geometry.attributes.position.array;
      const base = basePositions;
      const scat = scatterPositions;
      const v = velocities;

      const e = params.explode;
      const spring = params.spring;
      const damping = params.damping;
      const noiseAmp = params.noise;
      const flow = params.flow;
      const edgePull = params.edgePull;

      const nx = (i, x,y,z)=> Math.sin( (x*1.7 + t*0.9 + i*0.00007) ) * Math.cos( (z*1.3 - t*0.7) );
      const ny = (i, x,y,z)=> Math.sin( (y*1.9 - t*0.6 + i*0.00005) ) * Math.cos( (x*1.2 + t*0.8) );
      const nz = (i, x,y,z)=> Math.sin( (z*1.6 + t*0.7 + i*0.00006) ) * Math.cos( (y*1.1 - t*0.9) );

      for(let i=0;i<pos.length;i+=3){
        const x = pos[i], y = pos[i+1], z = pos[i+2];

        const tx0 = THREE.MathUtils.lerp(base[i],   scat[i],   e);
        const ty0 = THREE.MathUtils.lerp(base[i+1], scat[i+1], e);
        const tz0 = THREE.MathUtils.lerp(base[i+2], scat[i+2], e);

        // silhouette outward nudge (tightens silhouette feel)
        const w = (aW && normals) ? aW[i/3] : 0.0;
        const vxzLen = Math.sqrt(x*x + z*z) + 1e-6;
        const ex = (x / vxzLen) * edgePull * w;
        const ez = (z / vxzLen) * edgePull * w;

        const fx = ((tx0 + ex) - x) * spring;
        const fy = ( ty0      - y) * spring;
        const fz = ((tz0 + ez) - z) * spring;

        const px = nx(i, x,y,z) * noiseAmp * flow;
        const py = ny(i, x,y,z) * noiseAmp * flow;
        const pz = nz(i, x,y,z) * noiseAmp * flow;

        v[i]   = (v[i]   + fx + px) * damping;
        v[i+1] = (v[i+1] + fy + py) * damping;
        v[i+2] = (v[i+2] + fz + pz) * damping;

        // Tesla Logo attractor: first logoCount particles are used
        if(logoTargets && params.logo > 0.0){
          const pid = (i/3);
          if(pid < logoCount){
            const lx = logoTargets[pid*3+0] * params.logoSize + params.logoX;
            const ly = params.logoLift;
            const lz = logoTargets[pid*3+2] * params.logoSize + params.logoZ;

            const k = params.logo;
            // strong but stable attraction
            v[i]   += (lx - x) * spring * k * 2.0;
            v[i+1] += (ly - y) * spring * k * 2.0;
            v[i+2] += (lz - z) * spring * k * 2.0;
          }
        }

        pos[i]   += v[i];
        pos[i+1] += v[i+1];
        pos[i+2] += v[i+2];
      }

      points.geometry.attributes.position.needsUpdate = true;
    }

    // FX
    bloom.strength = params.bloomStrength;
    bloom.radius = params.bloomRadius;
    bloom.threshold = params.bloomThreshold;
    afterimage.uniforms["damp"].value = params.trail;
    renderer.toneMappingExposure = params.exposure;

    composer.render();
  }
  tick();

  // --------------------------
  // GUI
  // --------------------------
  const gui = new GUI({ width: 340 });
  gui.domElement.style.position = "fixed";
  gui.domElement.style.right = "18px";
  gui.domElement.style.top = "18px";
  gui.domElement.style.zIndex = "10";

  const gParticles = gui.addFolder("Particles");
  gParticles.add(params, "count", 20000, 220000, 1000).name("Count (rebuild)").onFinishChange(()=>{
    createPointCloudFromPositions(buildProceduralTeslaPoints(params.count), null);
  });
  gParticles.add(params, "size", 0.004, 0.035, 0.001).name("Size").onChange(v=>{
    particleMat.uniforms.uSize.value = v*1000;
  });
  gParticles.add(params, "opacity", 0.2, 1.0, 0.01).name("Opacity").onChange(v=>{
    particleMat.uniforms.uOpacity.value = v;
  });
  gParticles.addColor(params, "colorA").name("Color A").onChange(v=>{
    particleMat.uniforms.uColorA.value.set(v);
  });
  gParticles.addColor(params, "colorB").name("Color B").onChange(v=>{
    particleMat.uniforms.uColorB.value.set(v);
  });
  gParticles.add(params, "colorMix", 0, 1, 0.01).name("Color Mix").onChange(v=>{
    particleMat.uniforms.uColorMix.value = v;
  });
  gParticles.open();

  const gMotion = gui.addFolder("Motion");
  gMotion.add(params, "explode", 0, 1, 0.001).name("Explode");
  gMotion.add(params, "explodeRadius", 0.6, 6.0, 0.05).name("Explode Radius").onFinishChange(()=>{
    if(basePositions) scatterPositions = makeScatterFromBase(basePositions);
  });
  gMotion.add(params, "spring", 0.01, 0.22, 0.005).name("Spring");
  gMotion.add(params, "damping", 0.65, 0.98, 0.005).name("Damping");
  gMotion.add(params, "noise", 0.0, 0.55, 0.01).name("Noise");
  gMotion.add(params, "flow", 0.0, 2.0, 0.01).name("Flow");
  gMotion.add(params, "edgePull", 0.0, 0.40, 0.01).name("Edge Pull");
  gMotion.add(params, "autoRotate").name("Auto Rotate");
  gMotion.add(params, "autoRotateSpeed", 0.0, 1.5, 0.01).name("Rotate Speed");
  gMotion.open();

  const gLogo = gui.addFolder("Tesla Logo");
  gLogo.add(params, "logo", 0, 1, 0.001).name("Strength");
  gLogo.add(params, "logoSize", 0.25, 1.2, 0.01).name("Size");
  gLogo.add(params, "logoLift", 0.6, 1.8, 0.01).name("Height (Y)");
  gLogo.add(params, "logoX", -1.6, 0.2, 0.01).name("Forward (X)");
  gLogo.add(params, "logoZ", -0.6, 0.6, 0.01).name("Offset (Z)");
  gLogo.open();

  const gFX = gui.addFolder("FX");
  gFX.add(params, "bloomStrength", 0.0, 2.5, 0.01).name("Bloom Strength");
  gFX.add(params, "bloomRadius", 0.0, 1.0, 0.01).name("Bloom Radius");
  gFX.add(params, "bloomThreshold", 0.0, 1.0, 0.01).name("Bloom Threshold");
  gFX.add(params, "trail", 0.0, 0.96, 0.001).name("Trail");
  gFX.add(params, "exposure", 0.6, 1.8, 0.01).name("Exposure");
  gFX.open();

  // --------------------------
  // UI toggles
  // --------------------------
  let guiVisible = true;
  const hud = document.getElementById("hud");
  const drop = document.getElementById("drop");
  window.addEventListener("keydown", (e)=>{
    const k = e.key.toLowerCase();

      guiVisible = !guiVisible;
      gui.domElement.style.display = guiVisible ? "" : "none";

      params.showHUD = !params.showHUD;

  // --------------------------

  // --------------------------
  document.getElementById("btnExplode").addEventListener("click", ()=>{
    params.explode = params.explode < 0.5 ? 1.0 : 0.0;

  });
  document.getElementById("btnAuto").addEventListener("click", ()=>{
    params.autoRotate = !params.autoRotate;
    toast(params.autoRotate ? "自動回転 ON" : "自動回転 OFF", true);
  });
  document.getElementById("btnReset").addEventListener("click", ()=>{
    params.explode = 0.0;
    params.autoRotate = false;
    root.rotation.set(0,0,0);
    camera.position.set(0, 1.2, 5.2);
    controls.target.set(0, 0.9, 0);

    toast("視点・状態をリセット", true);
  });
  document.getElementById("btnShot").addEventListener("click", ()=>{
    composer.render();
    const a = document.createElement("a");
    a.href = renderer.domElement.toDataURL("image/png");
    a.download = "tesla_particles.png";

    toast("スクショ保存", true);
  });

  // --------------------------
  // Resize
  // --------------------------
  window.addEventListener("resize", ()=>{
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    composer.setSize(innerWidth, innerHeight);
  });

  // --------------------------
  // GLB/GLTF Drag & Drop -> sample points + normals
  // --------------------------
  const dropzone = document.getElementById("dropzone");
  const loader = new GLTFLoader();

  function extractSampledPointsAndNormalsFromObject(obj, count){
    // Collect triangles with areas and vertex normals (interpolated)
    const meshes = [];
    obj.traverse((n)=>{
      if(n.isMesh && n.geometry){
        const g = n.geometry.clone();
        g.applyMatrix4(n.matrixWorld);
        // ensure normals exist (for silhouette)
        if(!g.getAttribute("normal")){
          g.computeVertexNormals();
        }
        meshes.push(g);
      }
    });
    if(meshes.length===0) throw new Error("メッシュが見つかりません");

    const tris = [];
    let totalArea = 0;

    const vA = new THREE.Vector3(), vB = new THREE.Vector3(), vC = new THREE.Vector3();
    const nA = new THREE.Vector3(), nB = new THREE.Vector3(), nC = new THREE.Vector3();

    for(const g of meshes){
      const pos = g.getAttribute("position");
      const nor = g.getAttribute("normal");
      if(!pos || !nor) { g.dispose(); continue; }

      const idx = g.index ? g.index.array : null;
      const triCount = idx ? idx.length/3 : pos.count/3;

      for(let t=0;t<triCount;t++){
        const i0 = idx ? idx[t*3+0] : t*3+0;
        const i1 = idx ? idx[t*3+1] : t*3+1;
        const i2 = idx ? idx[t*3+2] : t*3+2;

        vA.fromBufferAttribute(pos, i0);
        vB.fromBufferAttribute(pos, i1);
        vC.fromBufferAttribute(pos, i2);

        nA.fromBufferAttribute(nor, i0);
        nB.fromBufferAttribute(nor, i1);
        nC.fromBufferAttribute(nor, i2);

        const area = new THREE.Vector3().subVectors(vB, vA)
          .cross(new THREE.Vector3().subVectors(vC, vA)).length() * 0.5;

        if(area > 1e-10){
          totalArea += area;
          tris.push({
            vA: vA.clone(), vB: vB.clone(), vC: vC.clone(),
            nA: nA.clone(), nB: nB.clone(), nC: nC.clone(),
            cum: totalArea
          });
        }
      }
      g.dispose();
    }
    if(tris.length===0) throw new Error("有効な三角形が見つかりません");

    const outP = new Float32Array(count*3);
    const outN = new Float32Array(count*3);

    for(let i=0;i<count;i++){
      const r = Math.random()*totalArea;
      let lo=0, hi=tris.length-1;
      while(lo<hi){
        const mid=(lo+hi)>>1;
        if(tris[mid].cum < r) lo=mid+1;
        else hi=mid;
      }
      const tri = tris[lo];

      // uniform sample on triangle
      let u = Math.random();
      let v = Math.random();
      if(u+v>1){ u=1-u; v=1-v; }

      const p = tri.vA.clone()
        .add(tri.vB.clone().sub(tri.vA).multiplyScalar(u))
        .add(tri.vC.clone().sub(tri.vA).multiplyScalar(v));

      // barycentric normal interpolation (approx)
      const w = 1 - u - v;
      const nn = tri.nA.clone().multiplyScalar(w)
        .add(tri.nB.clone().multiplyScalar(u))
        .add(tri.nC.clone().multiplyScalar(v))
        .normalize();

      outP[i*3+0]=p.x; outP[i*3+1]=p.y; outP[i*3+2]=p.z;
      outN[i*3+0]=nn.x; outN[i*3+1]=nn.y; outN[i*3+2]=nn.z;
    }

    // center/scale positions; normals are unaffected
    centerAndScalePositions(outP, 1.0);
    return { positions: outP, normals: outN };
  }

  function handleFiles(fileList){
    const file = [...fileList].find(f=>/\.glb$/i.test(f.name) || /\.gltf$/i.test(f.name));
    if(!file){
      toast("GLB/GLTF が見つかりません", false);
      return;
    }
    const url = URL.createObjectURL(file);

    loader.load(url, (gltf)=>{
      URL.revokeObjectURL(url);

      const obj = gltf.scene;
      obj.updateMatrixWorld(true);

      // normalize object scale before sampling
      const box = new THREE.Box3().setFromObject(obj);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      box.getSize(size);
      box.getCenter(center);
      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const s = 2.0 / maxDim;
      obj.position.sub(center);
      obj.scale.multiplyScalar(s);
      obj.updateMatrixWorld(true);

      const sampled = extractSampledPointsAndNormalsFromObject(obj, params.count);
      createPointCloudFromPositions(sampled.positions, sampled.normals);

      toast(`モデル読込: ${file.name} → 粒子化 + 輪郭強調`, true);
    }, undefined, (err)=>{
      URL.revokeObjectURL(url);
      console.error(err);
      toast("読み込み失敗（GLTF依存ファイル不足の可能性）", false);
    });
  }

  // Drag & Drop UI effects
  let dragDepth = 0;
  window.addEventListener("dragenter", (e)=>{ e.preventDefault(); dragDepth++; dropzone.style.borderColor="rgba(120,140,255,.75)"; });
  window.addEventListener("dragleave", (e)=>{ e.preventDefault(); dragDepth--; if(dragDepth<=0){ dropzone.style.borderColor="rgba(120,140,255,.35)"; dragDepth=0; }});
  window.addEventListener("dragover", (e)=>{ e.preventDefault(); });
  window.addEventListener("drop", (e)=>{
    e.preventDefault();
    dragDepth = 0;
    dropzone.style.borderColor="rgba(120,140,255,.35)";
    if(e.dataTransfer?.files?.length){
      handleFiles(e.dataTransfer.files);
    }
  });

  toast("起動完了：ドラッグ=回転 / ホイール=ズーム（Logo既定ON）", true);
</script>
