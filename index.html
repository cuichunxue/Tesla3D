<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Tesla 3D Viewer</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{
      height:100%;
      background:#000;
      color:#fff;
      overflow:hidden;
      touch-action:none;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    }
    canvas{display:block;width:100%;height:100%;touch-action:none;}

    /* Floating controls */
    .controls{
      position:fixed;
      right:16px;
      bottom:20px;
      display:flex;
      flex-direction:column;
      gap:12px;
      z-index:100;
    }
    .btn{
      width:56px;
      height:56px;
      border-radius:50%;
      background:rgba(20,20,30,0.85);
      backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,0.15);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:24px;
      cursor:pointer;
      transition:all 0.2s ease;
      box-shadow:0 4px 16px rgba(0,0,0,0.4);
      user-select:none;
    }
    .btn:active{
      transform:scale(0.92);
      background:rgba(40,40,60,0.95);
    }
    .btn.active{
      background:rgba(60,90,255,0.35);
      border-color:rgba(100,140,255,0.5);
      box-shadow:0 0 20px rgba(80,120,255,0.4);
    }

    /* Minimal info badge */
    .info{
      position:fixed;
      top:20px;
      left:50%;
      transform:translateX(-50%);
      padding:8px 16px;
      background:rgba(20,20,30,0.7);
      backdrop-filter:blur(10px);
      border-radius:20px;
      font-size:13px;
      color:rgba(255,255,255,0.7);
      border:1px solid rgba(255,255,255,0.1);
      pointer-events:none;
      opacity:0;
      transition:opacity 0.3s ease;
    }
    .info.show{opacity:1;}
  </style>
</head>
<body>
  <div class="info" id="info">タッチで回転・ズーム</div>

  <div class="controls">
    <div class="btn" id="btnRotate" title="自動回転">🔄</div>
    <div class="btn" id="btnReset" title="リセット">⟲</div>
  </div>

<script type="module">
  import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
  import { OrbitControls } from "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js";
  import { EffectComposer } from "https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js";
  import { RenderPass } from "https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/RenderPass.js";
  import { UnrealBloomPass } from "https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/UnrealBloomPass.js";
  import { OutputPass } from "https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/OutputPass.js";

  // Info display helper
  const infoEl = document.getElementById("info");
  function showInfo(msg, duration=2000){
    infoEl.textContent = msg;
    infoEl.classList.add("show");
    clearTimeout(infoEl._t);
    if(duration > 0){
      infoEl._t = setTimeout(()=>infoEl.classList.remove("show"), duration);
    }
  }

  // Scene setup
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a12);
  scene.fog = new THREE.Fog(0x0a0a12, 8, 25);

  // Camera setup - Perspective for better mobile performance
  const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);

  // Isometric-style angle (elevated view)
  camera.position.set(4, 3, 4);
  camera.lookAt(0, 0.5, 0);

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: false,
    powerPreference: "high-performance"
  });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.3;
  document.body.appendChild(renderer.domElement);

  // Touch-optimized controls
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.enableZoom = true;
  controls.zoomSpeed = 0.8;
  controls.minDistance = 2;
  controls.maxDistance = 15;
  controls.target.set(0, 0.5, 0);
  controls.enablePan = true;
  controls.panSpeed = 0.6;
  controls.rotateSpeed = 0.6;
  controls.touches = {
    ONE: THREE.TOUCH.ROTATE,
    TWO: THREE.TOUCH.DOLLY_PAN
  };

  // Lighting (brighter for visibility)
  const keyLight = new THREE.DirectionalLight(0xffffff, 1.0);
  keyLight.position.set(5, 8, 3);
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0x8899ff, 0.5);
  fillLight.position.set(-3, 4, -4);
  scene.add(fillLight);

  const rimLight = new THREE.DirectionalLight(0xaabbff, 0.4);
  rimLight.position.set(0, 2, -5);
  scene.add(rimLight);

  scene.add(new THREE.AmbientLight(0x6080b0, 0.4));

  // Ground
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(100, 100),
    new THREE.MeshStandardMaterial({
      color: 0x050510,
      roughness: 1.0,
      metalness: 0.0
    })
  );
  ground.rotation.x = -Math.PI/2;
  ground.position.y = 0;
  ground.receiveShadow = true;
  scene.add(ground);

  // Post-processing (lightweight for mobile)
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(
    new THREE.Vector2(innerWidth, innerHeight),
    0.6,  // strength
    0.4,  // radius
    0.3   // threshold
  );
  composer.addPass(bloom);
  composer.addPass(new OutputPass());

  // Particle system container
  const root = new THREE.Group();
  scene.add(root);

  let points = null;
  let basePositions = null;
  let targetPositions = null;
  let scatterPositions = null;
  let velocities = null;
  let normals = null;
  let aW = null;
  let logoTargets = null;
  let logoCount = 0;

  // Parameters (mobile optimized)
  const params = {
    count: 50000,  // Balanced for mobile
    size: 0.018,
    opacity: 1.0,
    explode: 0.0,
    explodeRadius: 2.8,
    spring: 0.09,
    damping: 0.86,
    noise: 0.15,
    flow: 0.7,
    edgePull: 0.12,
    autoRotate: false,
    autoRotateSpeed: 0.3,
    logo: 0.7,
    logoSize: 0.55,
    logoLift: 0.9,
    logoX: -0.7,
    logoZ: 0.0,
  };

  // Particle shader (perspective camera, silhouette aware)
  const particleMat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    uniforms: {
      uSize: { value: params.size * 1000 },
      uOpacity: { value: params.opacity },
      uTime: { value: 0 },
    },
    vertexShader: `
      uniform float uSize;
      uniform float uTime;
      attribute float aW;
      varying float vW;
      varying float vY;
      varying float vDepth;

      void main(){
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vY = position.y;
        vW = aW;
        vDepth = clamp((-mv.z - 1.0) / 10.0, 0.0, 1.0);

        // Perspective size attenuation
        float size = uSize / max(1.0, -mv.z);
        size *= mix(1.2, 3.0, vW); // Emphasize silhouette edges

        gl_PointSize = size;
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: `
      uniform float uOpacity;
      varying float vY;
      varying float vW;
      varying float vDepth;

      void main(){
        vec2 uv = gl_PointCoord - vec2(0.5);
        float d = length(uv);
        float alpha = smoothstep(0.5, 0.0, d);
        alpha = pow(alpha, 1.2);

        // Tesla-inspired colors (blue-white gradient)
        vec3 colA = vec3(0.55, 0.75, 1.0);
        vec3 colB = vec3(1.0, 1.0, 1.0);
        float heightMix = clamp(vY / 1.6, 0.0, 1.0);
        vec3 col = mix(colA, colB, mix(heightMix, 1.0, vDepth * 0.5));

        // Silhouette edges glow
        col *= mix(1.3, 2.5, vW);
        alpha *= mix(1.0, 1.7, vW);

        gl_FragColor = vec4(col, alpha * uOpacity);
      }
    `
  });

  function disposePoints(){
    if(!points) return;
    points.geometry.dispose();
    root.remove(points);
    points = null;
    basePositions = targetPositions = scatterPositions = velocities = null;
    normals = null;
    aW = null;
    logoTargets = null;
    logoCount = 0;
  }

  // Helpers
  const rand = (a,b)=> a + Math.random()*(b-a);

  function centerAndScalePositions(arr, targetRadius=1.0){
    let minX=Infinity,minY=Infinity,minZ=Infinity;
    let maxX=-Infinity,maxY=-Infinity,maxZ=-Infinity;
    for(let i=0;i<arr.length;i+=3){
      const x=arr[i], y=arr[i+1], z=arr[i+2];
      minX=Math.min(minX,x); minY=Math.min(minY,y); minZ=Math.min(minZ,z);
      maxX=Math.max(maxX,x); maxY=Math.max(maxY,y); maxZ=Math.max(maxZ,z);
    }
    const cx=(minX+maxX)/2, cy=(minY+maxY)/2, cz=(minZ+maxZ)/2;
    let maxR=0;
    for(let i=0;i<arr.length;i+=3){
      const x=arr[i]-cx, y=arr[i+1]-cy, z=arr[i+2]-cz;
      maxR = Math.max(maxR, Math.sqrt(x*x+y*y+z*z));
    }
    const s = (maxR>0) ? (targetRadius/maxR) : 1;
    for(let i=0;i<arr.length;i+=3){
      arr[i]   = (arr[i]-cx)*s;
      arr[i+1] = (arr[i+1]-cy)*s + 0.5;  // Lower Y offset for better view
      arr[i+2] = (arr[i+2]-cz)*s;
    }
  }

  function makeScatterFromBase(baseArr){
    const out = new Float32Array(baseArr.length);
    for(let i=0;i<baseArr.length;i+=3){
      const x=baseArr[i], y=baseArr[i+1], z=baseArr[i+2];
      const r = params.explodeRadius * (0.6 + Math.random()*0.6);
      const th = Math.random()*Math.PI*2;
      const ph = Math.acos(THREE.MathUtils.clamp(1 - 2*Math.random(), -1, 1));
      const sx = r*Math.sin(ph)*Math.cos(th);
      const sy = r*Math.cos(ph);
      const sz = r*Math.sin(ph)*Math.sin(th);
      out[i]   = x + sx;
      out[i+1] = y + sy;
      out[i+2] = z + sz;
    }
    return out;
  }

  // Tesla logo from SVG path
  function buildTeslaLogoPointsSVG(N){
    const path = new THREE.ShapePath();
    path.moveTo( 0.00,  1.00);
    path.bezierCurveTo( 0.35,  1.00,  0.55,  0.85,  0.55,  0.65);
    path.bezierCurveTo( 0.55,  0.45,  0.25,  0.35,  0.10,  0.30);
    path.lineTo( 0.02, -1.00);
    path.lineTo(-0.02, -1.00);
    path.lineTo(-0.10,  0.30);
    path.bezierCurveTo(-0.25,  0.35, -0.55,  0.45, -0.55,  0.65);
    path.bezierCurveTo(-0.55,  0.85, -0.35,  1.00,  0.00,  1.00);

    const shapes = path.toShapes(true);
    const pts = [];
    shapes.forEach(s=>{
      const p = s.getSpacedPoints(Math.max(300, Math.floor(N / shapes.length)));
      p.forEach(v=>pts.push(v.x, 0, v.y));
    });

    const out = new Float32Array(N*3);
    const m = pts.length/3;
    for(let i=0;i<N;i++){
      const j = (i % m) * 3;
      out[i*3+0] = pts[j+0];
      out[i*3+1] = pts[j+1];
      out[i*3+2] = pts[j+2];
    }
    return out;
  }

  // Procedural Tesla Model Y shape (SUV profile)
  function buildProceduralTeslaPoints(count){
    const keep = [];
    const capsuleField = (p, a, b, r) => {
      const pa = p.clone().sub(a);
      const ba = b.clone().sub(a);
      const h = THREE.MathUtils.clamp(pa.dot(ba)/ba.dot(ba), 0, 1);
      return pa.sub(ba.multiplyScalar(h)).length() - r;
    };

    const p = new THREE.Vector3();

    // Model Y body (larger, SUV-like)
    const aBody = new THREE.Vector3(-1.9, 0.7, 0);
    const bBody = new THREE.Vector3( 1.9, 0.7, 0);
    const rBody = 0.72;

    // Model Y cabin (taller, more boxy SUV cabin)
    const aCab  = new THREE.Vector3(-0.8, 1.35, 0);
    const bCab  = new THREE.Vector3( 1.2, 1.35, 0);
    const rCab  = 0.55;

    // Rear extended (SUV hatchback)
    const aRear = new THREE.Vector3(-1.4, 1.1, 0);
    const bRear = new THREE.Vector3(-0.3, 1.1, 0);
    const rRear = 0.48;

    // Wheels (Model Y positioning)
    const wheelC = [
      new THREE.Vector3(-1.25, 0.42, 0.85),
      new THREE.Vector3( 1.20, 0.42, 0.85),
      new THREE.Vector3(-1.25, 0.42,-0.85),
      new THREE.Vector3( 1.20, 0.42,-0.85),
    ];

    let tries = 0;
    while(keep.length < count*3 && tries < count*25){
      tries++;
      p.set(rand(-2.3, 2.3), rand(0.05, 2.2), rand(-1.15, 1.15));

      const dBody = capsuleField(p, aBody, bBody, rBody);
      const dCab  = capsuleField(p, aCab,  bCab,  rCab);
      const dRear = capsuleField(p, aRear, bRear, rRear);
      let d = Math.min(dBody, Math.min(dCab, dRear));

      // Wheel arches
      let arch = 0;
      for(const wc of wheelC){
        const dist = p.distanceTo(wc);
        arch += Math.exp(-dist*dist*4.5);
      }
      const density = THREE.MathUtils.clamp(1.0 - arch*0.7, 0.05, 1.0);

      if(d < 0 && Math.random() < density){
        const t = THREE.MathUtils.clamp((p.x + 2.3)/4.6, 0, 1);
        const smoothT = t*t*(3-2*t);

        // SUV body taper (wider at bottom, sleeker at top)
        const heightFactor = THREE.MathUtils.clamp(p.y / 2.0, 0, 1);
        p.z *= THREE.MathUtils.lerp(0.75, 1.0, smoothT) * THREE.MathUtils.lerp(1.05, 0.92, heightFactor);

        // Slight hood slope
        if(p.x > 0.8) p.y += 0.05 * Math.sin((p.x - 0.8) * 2.5) * Math.exp(-p.z*p.z*1.2);

        keep.push(p.x, p.y, p.z);
      }
    }

    const arr = new Float32Array(keep);
    centerAndScalePositions(arr, 1.2); // Slightly larger
    return arr;
  }

  // Create point cloud
  function createPointCloudFromPositions(posArr, normalArr=null){
    disposePoints();

    basePositions = posArr;
    normals = normalArr;
    targetPositions = new Float32Array(posArr);
    scatterPositions = makeScatterFromBase(basePositions);
    velocities = new Float32Array(posArr.length);

    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(targetPositions, 3));

    aW = new Float32Array(posArr.length/3);
    geo.setAttribute("aW", new THREE.BufferAttribute(aW, 1));

    if(normals){
      geo.setAttribute("normal", new THREE.BufferAttribute(normals, 3));
    }

    points = new THREE.Points(geo, particleMat);
    root.add(points);

    logoCount = Math.min(5000, Math.floor((posArr.length/3) * 0.08));
    logoTargets = buildTeslaLogoPointsSVG(logoCount);

    controls.target.set(0, 0.5, 0);
    controls.update();
  }

  // Initialize with procedural Tesla
  createPointCloudFromPositions(buildProceduralTeslaPoints(params.count), null);

  // Animation loop
  const clock = new THREE.Clock();
  const _viewDir = new THREE.Vector3();
  const _q = new THREE.Quaternion();
  const _n = new THREE.Vector3();

  function tick(){
    requestAnimationFrame(tick);
    const dt = Math.min(clock.getDelta(), 0.033);
    const t = clock.elapsedTime;

    if(params.autoRotate){
      root.rotation.y += dt * params.autoRotateSpeed;
    }
    controls.update();

    particleMat.uniforms.uTime.value = t;

    // Silhouette edge detection
    if(points && normals && aW){
      camera.getWorldDirection(_viewDir);
      root.getWorldQuaternion(_q);

      for(let i=0;i<aW.length;i++){
        _n.set(normals[i*3], normals[i*3+1], normals[i*3+2])
          .applyQuaternion(_q).normalize();
        aW[i] = Math.pow(1.0 - Math.abs(_n.dot(_viewDir)), 2.2);
      }
      points.geometry.attributes.aW.needsUpdate = true;
    }

    // Particle dynamics
    if(points){
      const pos = points.geometry.attributes.position.array;
      const base = basePositions;
      const scat = scatterPositions;
      const v = velocities;

      const e = params.explode;
      const spring = params.spring;
      const damping = params.damping;
      const noiseAmp = params.noise;
      const flow = params.flow;
      const edgePull = params.edgePull;

      const nx = (i, x,y,z)=> Math.sin((x*1.6 + t*0.8 + i*0.00006)) * Math.cos((z*1.2 - t*0.6));
      const ny = (i, x,y,z)=> Math.sin((y*1.8 - t*0.5 + i*0.00005)) * Math.cos((x*1.3 + t*0.7));
      const nz = (i, x,y,z)=> Math.sin((z*1.5 + t*0.6 + i*0.00007)) * Math.cos((y*1.4 - t*0.8));

      for(let i=0;i<pos.length;i+=3){
        const x = pos[i], y = pos[i+1], z = pos[i+2];

        const tx0 = THREE.MathUtils.lerp(base[i],   scat[i],   e);
        const ty0 = THREE.MathUtils.lerp(base[i+1], scat[i+1], e);
        const tz0 = THREE.MathUtils.lerp(base[i+2], scat[i+2], e);

        const w = (aW && normals) ? aW[i/3] : 0.0;
        const vxzLen = Math.sqrt(x*x + z*z) + 1e-6;
        const ex = (x / vxzLen) * edgePull * w;
        const ez = (z / vxzLen) * edgePull * w;

        const fx = ((tx0 + ex) - x) * spring;
        const fy = ( ty0      - y) * spring;
        const fz = ((tz0 + ez) - z) * spring;

        const px = nx(i, x,y,z) * noiseAmp * flow;
        const py = ny(i, x,y,z) * noiseAmp * flow;
        const pz = nz(i, x,y,z) * noiseAmp * flow;

        v[i]   = (v[i]   + fx + px) * damping;
        v[i+1] = (v[i+1] + fy + py) * damping;
        v[i+2] = (v[i+2] + fz + pz) * damping;

        // Tesla logo attractor
        if(logoTargets && params.logo > 0.0){
          const pid = (i/3);
          if(pid < logoCount){
            const lx = logoTargets[pid*3+0] * params.logoSize + params.logoX;
            const ly = params.logoLift;
            const lz = logoTargets[pid*3+2] * params.logoSize + params.logoZ;

            const k = params.logo;
            v[i]   += (lx - x) * spring * k * 2.2;
            v[i+1] += (ly - y) * spring * k * 2.2;
            v[i+2] += (lz - z) * spring * k * 2.2;
          }
        }

        pos[i]   += v[i];
        pos[i+1] += v[i+1];
        pos[i+2] += v[i+2];
      }

      points.geometry.attributes.position.needsUpdate = true;
    }

    composer.render();
  }
  tick();

  // Controls
  const btnRotate = document.getElementById("btnRotate");
  const btnReset = document.getElementById("btnReset");

  btnRotate.addEventListener("click", ()=>{
    params.autoRotate = !params.autoRotate;
    btnRotate.classList.toggle("active", params.autoRotate);
    showInfo(params.autoRotate ? "自動回転 ON" : "自動回転 OFF");
  });

  btnReset.addEventListener("click", ()=>{
    params.explode = 0.0;
    params.autoRotate = false;
    btnRotate.classList.remove("active");
    root.rotation.set(0,0,0);

    // Reset to elevated view
    camera.position.set(4, 3, 4);
    controls.target.set(0, 0.5, 0);
    controls.update();
    showInfo("リセット完了");
  });

  // Resize handler
  window.addEventListener("resize", ()=>{
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    composer.setSize(innerWidth, innerHeight);
  });

  // Initial welcome message
  setTimeout(()=>showInfo("Tesla Model Y", 3000), 500);
</script>
</body>
</html>
