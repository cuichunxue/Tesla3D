<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Tesla 3D Viewer</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      height:100vh;
      background:#000;
      overflow:hidden;
      font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    }
    canvas{display:block;width:100%;height:100%;}

    .controls{
      position:fixed;
      right:16px;
      bottom:20px;
      display:flex;
      flex-direction:column;
      gap:12px;
      z-index:100;
    }
    .btn{
      width:56px;
      height:56px;
      border-radius:50%;
      background:rgba(30,30,40,0.9);
      border:1px solid rgba(255,255,255,0.2);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:24px;
      cursor:pointer;
      box-shadow:0 4px 16px rgba(0,0,0,0.5);
      user-select:none;
    }
    .btn:active{transform:scale(0.95);}
    .btn.active{background:rgba(80,120,255,0.4);border-color:rgba(120,160,255,0.6);}
  </style>
</head>
<body>
  <div class="controls">
    <div class="btn" id="btnRotate">🔄</div>
    <div class="btn" id="btnReset">⟲</div>
  </div>

<script type="module">
  import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
  import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";

  // Scene
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a12);
  scene.fog = new THREE.Fog(0x0a0a12, 10, 40);

  // Camera
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.set(0, 2, 6);

  // Renderer
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Controls
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.target.set(0, 0.8, 0);
  controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };

  // Lights
  scene.add(new THREE.DirectionalLight(0xffffff, 1.5));
  scene.add(new THREE.AmbientLight(0x8899ff, 0.8));

  // Ground
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(50, 50),
    new THREE.MeshBasicMaterial({ color: 0x111122 })
  );
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  // Create Tesla Model Y shape
  function createTeslaParticles() {
    const count = 40000;
    const positions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);

    let index = 0;

    // Body (elongated box)
    for (let i = 0; i < count * 0.5; i++) {
      const x = (Math.random() - 0.5) * 3.5;
      const y = Math.random() * 0.8 + 0.3;
      const z = (Math.random() - 0.5) * 1.6;

      // Simple car shape filter
      if (Math.abs(z) < 0.8 - Math.abs(y - 0.6) * 0.3) {
        positions[index] = x;
        positions[index + 1] = y;
        positions[index + 2] = z;

        const brightness = 0.7 + y * 0.3;
        colors[index] = brightness;
        colors[index + 1] = brightness * 0.9;
        colors[index + 2] = 1.0;

        index += 3;
      }
    }

    // Cabin (upper part)
    for (let i = 0; i < count * 0.3; i++) {
      const x = (Math.random() - 0.5) * 2.2 - 0.2;
      const y = Math.random() * 0.6 + 0.8;
      const z = (Math.random() - 0.5) * 1.3;

      if (Math.abs(z) < 0.65 - Math.abs(y - 1.1) * 0.4) {
        positions[index] = x;
        positions[index + 1] = y;
        positions[index + 2] = z;

        colors[index] = 0.9;
        colors[index + 1] = 0.95;
        colors[index + 2] = 1.0;

        index += 3;
      }
    }

    // Trim arrays to actual size
    const actualPositions = new Float32Array(positions.buffer, 0, index);
    const actualColors = new Float32Array(colors.buffer, 0, index);

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(actualPositions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(actualColors, 3));

    const material = new THREE.PointsMaterial({
      size: 0.03,
      vertexColors: true,
      transparent: true,
      opacity: 0.9,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    return new THREE.Points(geometry, material);
  }

  const tesla = createTeslaParticles();
  scene.add(tesla);

  // Animation
  let autoRotate = false;

  function animate() {
    requestAnimationFrame(animate);

    if (autoRotate) {
      tesla.rotation.y += 0.005;
    }

    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  // Controls
  const btnRotate = document.getElementById('btnRotate');
  const btnReset = document.getElementById('btnReset');

  btnRotate.addEventListener('click', () => {
    autoRotate = !autoRotate;
    btnRotate.classList.toggle('active', autoRotate);
  });

  btnReset.addEventListener('click', () => {
    autoRotate = false;
    btnRotate.classList.remove('active');
    tesla.rotation.set(0, 0, 0);
    camera.position.set(0, 2, 6);
    controls.target.set(0, 0.8, 0);
    controls.update();
  });

  // Resize
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  console.log('Tesla 3D Viewer loaded');
</script>
</body>
</html>
