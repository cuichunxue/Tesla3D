<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Tesla 3D Viewer</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      height:100vh;
      background:#000;
      overflow:hidden;
      font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    }
    canvas{display:block;width:100%;height:100%;}

    .controls{
      position:fixed;
      right:16px;
      bottom:20px;
      display:flex;
      flex-direction:column;
      gap:12px;
      z-index:100;
    }
    .btn{
      width:56px;
      height:56px;
      border-radius:50%;
      background:rgba(30,30,40,0.9);
      border:1px solid rgba(255,255,255,0.2);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:24px;
      cursor:pointer;
      box-shadow:0 4px 16px rgba(0,0,0,0.5);
      user-select:none;
    }
    .btn:active{transform:scale(0.95);}
    .btn.active{background:rgba(80,120,255,0.4);border-color:rgba(120,160,255,0.6);}
  </style>
</head>
<body>
  <div class="controls">
    <div class="btn" id="btnRotate">🔄</div>
    <div class="btn" id="btnReset">⟲</div>
  </div>

<div id="status" style="position:fixed;top:10px;left:10px;color:#fff;background:rgba(0,0,0,0.8);padding:10px;font-size:12px;z-index:1000;max-width:90vw;word-wrap:break-word;"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
  const status = document.getElementById('status');
  function log(msg) {
    console.log(msg);
    status.innerHTML += msg + '<br>';
  }

  log('Starting...');

  try {
    log('Importing THREE.js...');
    const THREE = await import('three');
    log('THREE loaded: ' + (THREE ? 'OK' : 'FAIL'));

    const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
    log('OrbitControls loaded');

    const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
    log('GLTFLoader loaded');

    // Check WebGL
    const canvas = document.createElement('canvas');
    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    if (!gl) {
      log('ERROR: WebGL not supported!');
      throw new Error('WebGL not supported');
    }
    log('WebGL: OK');

  // Scene
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a12);
  scene.fog = new THREE.Fog(0x0a0a12, 10, 40);

  // Camera
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.set(0, 2, 6);

  // Renderer
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  // Controls
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.target.set(0, 0.8, 0);
  controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };

  // Lights - Enhanced for car showcase
  const mainLight = new THREE.DirectionalLight(0xffffff, 2.0);
  mainLight.position.set(5, 10, 7);
  mainLight.castShadow = true;
  mainLight.shadow.mapSize.width = 2048;
  mainLight.shadow.mapSize.height = 2048;
  scene.add(mainLight);

  const fillLight = new THREE.DirectionalLight(0xaabbff, 0.6);
  fillLight.position.set(-5, 5, -5);
  scene.add(fillLight);

  const rimLight = new THREE.DirectionalLight(0xffeedd, 0.8);
  rimLight.position.set(0, 3, -10);
  scene.add(rimLight);

  scene.add(new THREE.AmbientLight(0x404050, 0.5));

  // Ground
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(50, 50),
    new THREE.MeshStandardMaterial({
      color: 0x1a1a22,
      roughness: 0.8,
      metalness: 0.2
    })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // Load GT Race Car model
  let car = null;
  const loader = new GLTFLoader();

  log('Loading GT Race Car model...');

  loader.load(
    './modelY_wireframe.gltf',
    (gltf) => {
      log('Model loaded successfully');
      car = gltf.scene;

      // Center and scale the model
      const box = new THREE.Box3().setFromObject(car);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());

      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = 2.5 / maxDim;

      car.scale.multiplyScalar(scale);
      car.position.sub(center.multiplyScalar(scale));
      car.position.y = 0;

      // Improve materials
      car.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;

          if (child.material) {
            child.material.metalness = 0.9;
            child.material.roughness = 0.2;
            child.material.envMapIntensity = 1.5;
          }
        }
      });

      scene.add(car);
      log('Model added to scene');
      setTimeout(() => status.style.display = 'none', 3000);
    },
    (progress) => {
      const percent = (progress.loaded / progress.total * 100).toFixed(0);
      log('Loading: ' + percent + '%');
    },
    (error) => {
      log('ERROR loading model: ' + error.message);
    }
  );

  // Animation
  let autoRotate = false;

  function animate() {
    requestAnimationFrame(animate);

    if (autoRotate && car) {
      car.rotation.y += 0.005;
    }

    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  // Controls
  const btnRotate = document.getElementById('btnRotate');
  const btnReset = document.getElementById('btnReset');

  btnRotate.addEventListener('click', () => {
    autoRotate = !autoRotate;
    btnRotate.classList.toggle('active', autoRotate);
  });

  btnReset.addEventListener('click', () => {
    autoRotate = false;
    btnRotate.classList.remove('active');
    if (car) {
      car.rotation.set(0, 0, 0);
    }
    camera.position.set(0, 2, 6);
    controls.target.set(0, 0.8, 0);
    controls.update();
  });

  // Resize
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  log('GT Race Car Viewer ready');

  } catch (error) {
    log('ERROR: ' + error.message);
    log('Stack: ' + error.stack);
  }
</script>
</body>
</html>
